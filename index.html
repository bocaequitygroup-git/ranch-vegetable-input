<!--
  WorkerApp.html
  Ngapori Ranch VPOS — mobile field interface.
  Served by Code.gs's doGet() via HtmlService.createTemplateFromFile('WorkerApp').
  <?= scriptUrl ?> below is injected server-side with ScriptApp.getService().getUrl(),
  so this same page's client JS posts back to itself as a REST endpoint (doPost).

  Flow: PIN login -> scan Bed QR (BED:<ID>) -> pick activity -> Start -> (Pause/Resume) ->
  Complete (qty + unit) -> back to scan. Exception can be flagged at any point during an
  active/paused session.

  NOTE: the locked FIELD_LIVE_SESSION schema has Exception_Notes (text) but no photo/URL
  column, so this build omits the photo-upload capability mentioned in the original
  roadmap doc. Adding it needs a schema decision (a Photos_URL column, or a separate
  Drive-backed table) before it can be wired up — flagged rather than guessed at.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ngapori Ranch VPOS — Field App</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --field-dusk: #1B2620;      /* deep foliage-charcoal, not near-black-neon default */
    --field-dusk-2: #223129;
    --panel: #24352C;
    --panel-line: #3A4E41;
    --paper: #F0EDE3;           /* worn field-notebook paper, warm off-white */
    --paper-dim: #B9BFAE;
    --amber: #E8A33D;           /* radio-dial amber — the signature accent */
    --amber-dim: #7A5A20;
    --lime: #9BC53D;            /* active/growth state */
    --rust: #C4562A;            /* exception/alert state */
    --mono: 'Courier New', ui-monospace, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--field-dusk);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px;
    background: var(--field-dusk-2);
    border-bottom: 2px solid var(--panel-line);
  }
  .topbar .brand { font-family: var(--mono); letter-spacing: 0.08em; font-size: 13px; color: var(--paper-dim); }
  .topbar .brand b { color: var(--amber); }
  .topbar .who { font-size: 13px; text-align: right; }
  .topbar .who .name { font-weight: 700; }
  .topbar .who .role { color: var(--paper-dim); font-family: var(--mono); font-size: 11px; text-transform: uppercase; }
  .logout-link { background: none; border: none; color: var(--rust); font-size: 12px; text-decoration: underline; padding: 4px 0; }

  main { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 16px; }
  .screen { display: none; flex: 1; flex-direction: column; gap: 16px; }
  .screen.active { display: flex; }

  h1 { font-size: 20px; margin: 0 0 4px; }
  p.hint { color: var(--paper-dim); font-size: 14px; margin: 0; line-height: 1.4; }

  /* ---- Login: PIN pad, deliberately large for gloved/outdoor use ---- */
  .login-card {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px;
    padding: 22px; display: flex; flex-direction: column; gap: 14px;
  }
  label { font-family: var(--mono); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--paper-dim); }
  select, input[type=text], textarea {
    width: 100%; padding: 14px; font-size: 17px; border-radius: 8px;
    border: 1px solid var(--panel-line); background: var(--field-dusk); color: var(--paper);
  }
  .pin-display {
    font-family: var(--mono); font-size: 32px; letter-spacing: 0.5em; text-align: center;
    padding: 12px 0; color: var(--amber); min-height: 44px;
  }
  .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .pin-pad button {
    padding: 18px 0; font-size: 22px; border-radius: 8px; border: 1px solid var(--panel-line);
    background: var(--field-dusk-2); color: var(--paper); font-family: var(--mono);
  }
  .pin-pad button:active { background: var(--amber-dim); }
  .pin-pad button.clear { color: var(--rust); font-size: 14px; }
  .pin-pad button.submit { color: var(--lime); font-size: 14px; }

  /* ---- Buttons ---- */
  .btn {
    display: block; width: 100%; padding: 18px; font-size: 17px; font-weight: 700;
    border-radius: 10px; border: none; text-align: center; cursor: pointer;
  }
  .btn-primary { background: var(--amber); color: var(--field-dusk); }
  .btn-active { background: var(--lime); color: var(--field-dusk); }
  .btn-secondary { background: transparent; border: 1px solid var(--panel-line); color: var(--paper); }
  .btn-danger { background: transparent; border: 1px solid var(--rust); color: var(--rust); }
  .btn:disabled { opacity: 0.45; }

  /* ---- Scan screen ---- */
  #qr-reader { width: 100%; border-radius: 10px; overflow: hidden; border: 1px solid var(--panel-line); }
  .scan-target {
    font-family: var(--mono); font-size: 13px; color: var(--paper-dim);
    display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); }

  /* ---- Session card ---- */
  .session-card {
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 12px;
    padding: 20px; display: flex; flex-direction: column; gap: 4px;
  }
  .session-card .bed { font-size: 22px; font-weight: 700; }
  .session-card .meta { font-family: var(--mono); font-size: 12px; color: var(--paper-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .status-pill {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px;
    font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 8px;
  }
  .status-ACTIVE { background: rgba(155,197,61,0.18); color: var(--lime); }
  .status-PAUSED { background: rgba(232,163,61,0.18); color: var(--amber); }

  /* Signature element: field-radio elapsed timer readout */
  .timer {
    font-family: var(--mono); font-size: 52px; text-align: center; letter-spacing: 0.03em;
    color: var(--amber); background: var(--field-dusk-2); border: 1px solid var(--panel-line);
    border-radius: 10px; padding: 18px 0; margin: 4px 0;
  }
  .timer .unit { font-size: 14px; color: var(--paper-dim); display: block; letter-spacing: 0.2em; }

  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  /* ---- Modal (exception + complete) ---- */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    display: none; align-items: flex-end; justify-content: center; z-index: 20;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--panel); border-top: 2px solid var(--panel-line);
    border-radius: 16px 16px 0 0; padding: 22px; width: 100%; max-width: 480px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .modal h2 { margin: 0; font-size: 18px; }

  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--field-dusk-2); border: 1px solid var(--panel-line);
    color: var(--paper); padding: 12px 18px; border-radius: 8px; font-size: 14px;
    display: none; z-index: 30; max-width: 90%;
  }
  .toast.error { border-color: var(--rust); color: var(--rust); }
  .toast.show { display: block; }
</style>
</head>
<body>

  <div class="topbar">
    <div class="brand">NGAPORI RANCH · <b>VPOS FIELD</b></div>
    <div class="who" id="whoBox" style="display:none;">
      <div class="name" id="whoName"></div>
      <div class="role" id="whoRole"></div>
      <button class="logout-link" id="logoutBtn">Log out</button>
    </div>
  </div>

  <main>

    <!-- LOGIN -->
    <section class="screen active" id="screen-login">
      <h1>Log in</h1>
      <p class="hint">Enter your Worker ID, then your 4-digit PIN.</p>
      <div class="login-card">
        <div>
          <label for="userIdInput">Worker ID</label>
          <input type="text" id="userIdInput" placeholder="USR-WORKER1" autocapitalize="characters">
        </div>
        <div>
          <label>PIN</label>
          <div class="pin-display" id="pinDisplay">----</div>
          <div class="pin-pad">
            <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
            <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
            <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
            <button class="clear" data-key="clear">CLEAR</button><button data-key="0">0</button>
            <button class="submit" data-key="submit">GO</button>
          </div>
        </div>
      </div>
    </section>

    <!-- SCAN -->
    <section class="screen" id="screen-scan">
      <h1>Scan a bed</h1>
      <div class="scan-target"><span class="dot"></span> Point the camera at a bed's QR sign</div>
      <div id="qr-reader"></div>
      <button class="btn btn-secondary" id="cancelScanBtn">Cancel</button>
    </section>

    <!-- ACTIVITY PICK (after scan, before Start) -->
    <section class="screen" id="screen-activity">
      <h1>Start a session</h1>
      <div class="session-card">
        <div class="bed" id="pickedBedId">—</div>
        <div class="meta">Scanned bed</div>
      </div>
      <div>
        <label for="activityType">Activity</label>
        <select id="activityType">
          <option value="Harvest">Harvest</option>
          <option value="Weeding">Weeding</option>
          <option value="Pruning">Pruning</option>
          <option value="Irrigation">Irrigation</option>
          <option value="Planting">Planting</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <button class="btn btn-primary" id="startSessionBtn">Start session</button>
      <button class="btn btn-secondary" id="backToScanBtn">Rescan</button>
    </section>

    <!-- ACTIVE SESSION -->
    <section class="screen" id="screen-session">
      <div class="session-card">
        <div class="bed" id="activeBedId">—</div>
        <div class="meta" id="activeActivity">—</div>
        <span class="status-pill" id="statusPill">ACTIVE</span>
      </div>
      <div class="timer" id="timerReadout">00:00<span class="unit">ELAPSED MIN:SEC</span></div>
      <div class="btn-row">
        <button class="btn btn-active" id="pauseResumeBtn">Pause</button>
        <button class="btn btn-danger" id="exceptionBtn">Flag exception</button>
      </div>
      <button class="btn btn-primary" id="completeBtn">Complete session</button>
    </section>

  </main>

  <!-- EXCEPTION MODAL -->
  <div class="modal-backdrop" id="exceptionModal">
    <div class="modal">
      <h2>Flag exception</h2>
      <div>
        <label for="exceptionType">Type</label>
        <select id="exceptionType">
          <option>Pest Discovered</option>
          <option>Irrigation Failure</option>
          <option>Equipment Failure</option>
          <option>Crop Damage</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label for="exceptionNotes">Notes</label>
        <textarea id="exceptionNotes" rows="3" placeholder="What's going on?"></textarea>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="exceptionCancelBtn">Cancel</button>
        <button class="btn btn-danger" id="exceptionSubmitBtn" style="background: var(--rust); color: var(--paper);">Submit</button>
      </div>
    </div>
  </div>

  <!-- COMPLETE MODAL -->
  <div class="modal-backdrop" id="completeModal">
    <div class="modal">
      <h2>Complete session</h2>
      <div>
        <label for="loggedQty">Quantity</label>
        <input type="text" inputmode="decimal" id="loggedQty" placeholder="0">
      </div>
      <div>
        <label for="loggedUnit">Unit</label>
        <select id="loggedUnit">
          <option>LBS</option>
          <option>CASES</option>
          <option>KG</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="completeCancelBtn">Cancel</button>
        <button class="btn btn-primary" id="completeSubmitBtn">Submit</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  var SCRIPT_URL = '<?= scriptUrl ?>';

  var state = {
    user: null,          // { user_id, full_name, role }
    pin: '',
    bedId: null,
    sessionId: null,
    activityType: null,
    status: null,         // ACTIVE | PAUSED
    startedAt: null,
    timerHandle: null,
    html5QrCode: null
  };

  // ---- helpers ----
  function $(id) { return document.querySelector(id); }
  function showScreen(id) {
    // Called throughout with a bare id ('screen-scan', not '#screen-scan') — use
    // getElementById directly rather than $ (which expects a full CSS selector) so
    // this doesn't depend on every call site matching the '#'-prefixed convention.
    document.querySelectorAll('.screen').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }
  function toast(msg, isError) {
    var t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (isError ? ' error' : '');
    setTimeout(function () { t.className = 'toast'; }, 3200);
  }

  function post(action, payload) {
    var body = Object.assign({ action: action }, payload || {});
    return fetch(SCRIPT_URL, {
      method: 'POST',
      // text/plain avoids a CORS preflight against the Apps Script Web App, matching
      // the response side's ContentService.MimeType.TEXT convention in Code.gs.
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(body)
    })
      .then(function (r) { return r.text(); })
      .then(function (text) { return JSON.parse(text); });
  }

  // ---- login / PIN pad ----
  $('#screen-login').addEventListener('click', function (e) {
    var key = e.target.dataset && e.target.dataset.key;
    if (!key) return;

    if (key === 'clear') {
      state.pin = '';
    } else if (key === 'submit') {
      try { doLogin(); } catch (err) { toast('Login error: ' + err, true); }
      return;
    } else if (state.pin.length < 4) {
      state.pin += key;
    }
    renderPinDisplay();
  });

  // Masked PIN readout: filled dot per digit entered, dash per digit remaining.
  // Never renders the actual digits.
  function renderPinDisplay() {
    var masked = state.pin.replace(/./g, '\u25CF').padEnd(4, '-');
    $('#pinDisplay').textContent = masked.split('').join(' ');
  }

  function doLogin() {
    var userId = $('#userIdInput').value.trim().toUpperCase();
    if (!userId) { toast('Enter your Worker ID', true); return; }
    if (state.pin.length !== 4) { toast('PIN must be 4 digits', true); return; }

    // Built via fromCharCode, not written as a literal here — Apps Script's HtmlService
    // template compiler treats that two-character open-scriptlet delimiter anywhere in
    // this file (even inside a client-side script string, even in a comment) as the
    // start of a server scriptlet, which broke page load entirely when this check used
    // the raw delimiter characters directly.
    var UNRESOLVED_MARKER = String.fromCharCode(60, 63);
    if (!SCRIPT_URL || SCRIPT_URL.indexOf(UNRESOLVED_MARKER) === 0 || SCRIPT_URL === '') {
      toast('App not connected to the script backend (scriptUrl missing) — reload from the deployed web app URL, not a local file.', true);
      return;
    }

    post('LOGIN', { user_id: userId, pin: state.pin }).then(function (res) {
      state.pin = '';
      renderPinDisplay();
      if (!res.ok) { toast(res.error || 'Login failed', true); return; }

      state.user = res;
      $('#whoName').textContent = res.full_name;
      $('#whoRole').textContent = res.role;
      $('#whoBox').style.display = 'block';
      showScreen('screen-scan');
      startScanner();
    }).catch(function (err) { toast('Network error: ' + err, true); });
  }

  $('#logoutBtn').addEventListener('click', function () {
    if (!state.user) return;
    post('LOGOUT', { user_id: state.user.user_id }).finally(function () {
      state.user = null;
      $('#whoBox').style.display = 'none';
      stopScanner();
      showScreen('screen-login');
    });
  });

  // ---- QR scan ----
  function startScanner() {
    if (state.html5QrCode) return;
    state.html5QrCode = new Html5Qrcode('qr-reader');
    var scanConfig = { fps: 10, qrbox: 240 };

    // Prefer the rear ("environment") camera — the normal case on a phone/tablet in
    // the field. If that constraint can't be satisfied (e.g. NotFoundError — no camera
    // matches "environment", commonly a desktop/laptop with only a front webcam, or a
    // device that just doesn't report facingMode reliably), fall back to whatever
    // camera Html5Qrcode can actually find, rather than hard-failing the scan screen.
    state.html5QrCode.start({ facingMode: 'environment' }, scanConfig, onScanSuccess, function () {})
      .catch(function (err) {
        Html5Qrcode.getCameras().then(function (cameras) {
          if (!cameras || !cameras.length) {
            toast('No camera found on this device', true);
            return;
          }
          state.html5QrCode.start(cameras[0].id, scanConfig, onScanSuccess, function () {})
            .catch(function (fallbackErr) { toast('Camera error: ' + fallbackErr, true); });
        }).catch(function (listErr) {
          toast('Camera error: ' + listErr, true);
        });
      });
  }
  function stopScanner() {
    if (state.html5QrCode) {
      state.html5QrCode.stop().catch(function () {});
      state.html5QrCode = null;
    }
  }
  function onScanSuccess(decodedText) {
    // Expected format per QR_REGISTRY / BED_MASTER.QR_Code: "BED:<Bed_ID>"
    var match = /^BED:(.+)$/.exec(decodedText.trim());
    if (!match) { toast('Not a bed QR: ' + decodedText, true); return; }

    stopScanner();
    state.bedId = match[1];
    $('#pickedBedId').textContent = state.bedId;
    showScreen('screen-activity');
  }
  $('#cancelScanBtn').addEventListener('click', function () {
    stopScanner();
    showScreen('screen-login'); // no active session yet, nothing to lose
  });
  $('#backToScanBtn').addEventListener('click', function () {
    showScreen('screen-scan');
    startScanner();
  });

  // ---- session start ----
  $('#startSessionBtn').addEventListener('click', function () {
    state.activityType = $('#activityType').value;
    $('#startSessionBtn').disabled = true;
    post('START_SESSION', {
      worker_id: state.user.user_id,
      bed_id: state.bedId,
      activity_type: state.activityType
    }).then(function (res) {
      $('#startSessionBtn').disabled = false;
      if (!res.ok) { toast(res.error || 'Could not start session', true); return; }
      state.sessionId = res.session_id;
      state.status = res.status;
      state.startedAt = Date.now();
      enterSessionScreen();
    }).catch(function (err) {
      $('#startSessionBtn').disabled = false;
      toast('Network error: ' + err, true);
    });
  });

  function enterSessionScreen() {
    $('#activeBedId').textContent = state.bedId;
    $('#activeActivity').textContent = state.activityType;
    updateStatusPill();
    showScreen('screen-session');
    runTimer();
  }

  function updateStatusPill() {
    var pill = $('#statusPill');
    pill.textContent = state.status;
    pill.className = 'status-pill status-' + state.status;
    $('#pauseResumeBtn').textContent = state.status === 'PAUSED' ? 'Resume' : 'Pause';
  }

  function runTimer() {
    clearInterval(state.timerHandle);
    state.timerHandle = setInterval(function () {
      var elapsedSec = Math.floor((Date.now() - state.startedAt) / 1000);
      var mm = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      var ss = String(elapsedSec % 60).padStart(2, '0');
      $('#timerReadout').innerHTML = mm + ':' + ss + '<span class="unit">ELAPSED MIN:SEC</span>';
    }, 1000);
  }

  // ---- pause / resume ----
  $('#pauseResumeBtn').addEventListener('click', function () {
    var toStatus = state.status === 'PAUSED' ? 'RESUME_SESSION' : 'PAUSE_SESSION';
    post(toStatus, { session_id: state.sessionId }).then(function (res) {
      if (!res.ok) { toast(res.error || 'Could not update session', true); return; }
      state.status = res.status;
      updateStatusPill();
    }).catch(function (err) { toast('Network error: ' + err, true); });
  });

  // ---- exception modal ----
  $('#exceptionBtn').addEventListener('click', function () { $('#exceptionModal').classList.add('open'); });
  $('#exceptionCancelBtn').addEventListener('click', function () { $('#exceptionModal').classList.remove('open'); });
  $('#exceptionSubmitBtn').addEventListener('click', function () {
    post('FLAG_EXCEPTION', {
      session_id: state.sessionId,
      exception_type: $('#exceptionType').value,
      notes: $('#exceptionNotes').value.trim()
    }).then(function (res) {
      $('#exceptionModal').classList.remove('open');
      if (!res.ok) { toast(res.error || 'Could not flag exception', true); return; }
      $('#exceptionNotes').value = '';
      toast('Exception flagged');
    }).catch(function (err) { toast('Network error: ' + err, true); });
  });

  // ---- complete modal ----
  $('#completeBtn').addEventListener('click', function () { $('#completeModal').classList.add('open'); });
  $('#completeCancelBtn').addEventListener('click', function () { $('#completeModal').classList.remove('open'); });
  $('#completeSubmitBtn').addEventListener('click', function () {
    var qty = $('#loggedQty').value.trim();
    if (!qty) { toast('Enter a quantity', true); return; }
    post('COMPLETE_SESSION', {
      session_id: state.sessionId,
      logged_quantity: qty,
      unit: $('#loggedUnit').value
    }).then(function (res) {
      $('#completeModal').classList.remove('open');
      if (!res.ok) { toast(res.error || 'Could not complete session', true); return; }
      clearInterval(state.timerHandle);
      toast('Session completed — awaiting manager verification');
      $('#loggedQty').value = '';
      state.sessionId = null; state.bedId = null; state.status = null;
      showScreen('screen-scan');
      startScanner();
    }).catch(function (err) { toast('Network error: ' + err, true); });
  });

})();
</script>
</body>
</html>
