<script>
  // Paste your Apps Script Web App deployment URL below
  // Must be deployed as: "Execute as: Me" and "Who has access: Anyone"
  const WEB_APP_URL = 'https://script.google.com/macros/s/PASTE_YOUR_DEPLOYMENT_ID/exec';

  let state = {
    workerId: 'W-017',
    bedId: '',
    cohortId: '',
    crop: '',
    selectedActivity: '',
    sessionId: '',
    taxonomyGroups: {}
  };

  function apiCall(action, payload, callback) {
    fetch(WEB_APP_URL, {
      method: 'POST',
      mode: 'cors',
      redirect: 'follow', // REQUIRED: Follows Google's 302 backend redirect
      headers: {
        'Content-Type': 'text/plain;charset=utf-8' // REQUIRED: Avoids CORS OPTIONS preflight
      },
      body: JSON.stringify({ action: action, payload: payload })
    })
      .then(function(response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function(res) {
        callback(res);
      })
      .catch(function(error) {
        console.error('apiCall failed:', action, error);
        alert('Something went wrong (' + action + '): ' + error.message);
      });
  }

  function switchView(viewId) {
    ['view-login', 'view-scan', 'view-select-task', 'view-execution', 'view-exception', 'view-manager'].forEach(v => {
      document.getElementById(v).classList.add('hidden');
    });
    document.getElementById(viewId).classList.remove('hidden');
  }

  function appLogin() {
    state.workerId = document.getElementById('login-worker-id').value;
    let pin = document.getElementById('login-pin').value;
    
    apiCall('login', { workerId: state.workerId, pin: pin }, function(res) {
      if (res && res.success) {
        loadTaxonomy();
        switchView('view-scan');
      } else {
        alert('Authentication failed: ' + (res.error || 'Invalid credentials'));
      }
    });
  }

  function loadTaxonomy() {
    apiCall('get-taxonomy', {}, function(res) {
      if (res && res.success) {
        state.taxonomyGroups = res.groups;
        renderTaxonomyPicker();
      }
    });
  }

  function renderTaxonomyPicker() {
    let container = document.getElementById('activity-picker-container');
    container.innerHTML = '';
    
    let select = document.createElement('select');
    select.id = 'activity-select-dropdown';
    
    for (let group in state.taxonomyGroups) {
      let optgroup = document.createElement('optgroup');
      optgroup.label = group;
      
      state.taxonomyGroups[group].forEach(act => {
        let opt = document.createElement('option');
        opt.value = act;
        opt.textContent = act;
        optgroup.appendChild(opt);
      });
      select.appendChild(optgroup);
    }
    container.appendChild(select);
  }

  function appScanBed() {
    state.bedId = document.getElementById('scan-bed-input').value.toUpperCase();
    if (!state.bedId) return alert('Please enter or scan a Bed ID');

    apiCall('scan-bed', { bedId: state.bedId }, function(res) {
      if (res && res.success) {
        state.cohortId = res.bed.cohortId;
        state.crop = res.bed.crop;
        
        document.getElementById('lbl-bed-id').textContent = state.bedId;
        document.getElementById('lbl-cohort-id').textContent = state.cohortId;
        document.getElementById('lbl-crop').textContent = state.crop;
        
        switchView('view-select-task');
      } else {
        alert('Bed scan failed: ' + (res.error || 'Unknown bed ID'));
      }
    });
  }

  function appStartSession() {
    state.selectedActivity = document.getElementById('activity-select-dropdown').value;
    
    let payload = {
      workerId: state.workerId,
      bedId: state.bedId,
      cohortId: state.cohortId,
      activity: state.selectedActivity
    };

    apiCall('start-session', payload, function(res) {
      if (res && res.success) {
        state.sessionId = res.sessionId;
        document.getElementById('exec-bed').textContent = state.bedId;
        document.getElementById('exec-task').textContent = state.selectedActivity;
        document.getElementById('exec-start').textContent = new Date(res.startTime).toLocaleTimeString();
        switchView('view-execution');
      } else {
        alert(res.error || 'Failed to start session');
      }
    });
  }

  function appCompleteSession() {
    let quantity = 0;
    if (state.selectedActivity === 'Harvest') {
      quantity = prompt('Enter harvested quantity (lbs/crates):', '0');
    }

    apiCall('complete-session', { sessionId: state.sessionId, quantity: quantity }, function(res) {
      if (res && res.success) {
        alert('Activity completed. Duration: ' + res.elapsedMinutes + ' mins');
        switchView('view-scan');
      }
    });
  }

  function appReportExceptionPrompt() {
    switchView('view-exception');
  }

  function appSubmitException() {
    let payload = {
      workerId: state.workerId,
      sessionId: state.sessionId,
      exceptionType: document.getElementById('exc-type').value,
      severity: document.getElementById('exc-severity').value,
      notes: document.getElementById('exc-notes').value
    };

    apiCall('report-exception', payload, function(res) {
      if (res && res.success) {
        alert('Exception logged and manager notified.');
        document.getElementById('lbl-status').className = 'badge badge-danger';
        document.getElementById('lbl-status').textContent = 'ALERT';
        switchView('view-execution');
      }
    });
  }

  function loadLiveBoard() {
    apiCall('get-live-board', {}, function(res) {
      if (res && res.success) {
        let tbody = document.getElementById('live-board-rows');
        tbody.innerHTML = '';
        res.board.forEach(row => {
          let tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${row.workerId}</td>
            <td>${row.bed}</td>
            <td>${row.cohort}</td>
            <td>${row.activity}</td>
            <td>${row.elapsed}</td>
            <td><span class="badge ${row.status === 'ACTIVE' ? 'badge-active' : 'badge-warning'}">${row.status}</span></td>
            <td style="color:${row.exception !== '—' ? 'red' : 'inherit'};">${row.exception}</td>
          `;
          tbody.appendChild(tr);
        });
      }
    });
  }

  function appArchiveSessions() {
    apiCall('archive-completed-sessions', { managerId: state.workerId }, function(res) {
      if (res && res.success) {
        alert('Archived ' + res.archivedSessions + ' completed session(s) into permanent activity log.');
        loadLiveBoard();
      }
    });
  }
</script>
