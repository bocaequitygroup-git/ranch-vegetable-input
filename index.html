<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <?!= include('Stylesheet'); ?>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <h1>Ngapori Ranch VPOS</h1>
      <div class="sub" id="topbarSub">Field Worker</div>
    </div>
    <button class="btn btn-outline hidden" id="logoutBtn" style="width:auto;margin:0;padding:8px 12px;font-size:12px;">Log out</button>
  </div>
  <div class="content" id="content">
    <div class="spinner">Loading...</div>
  </div>
</div>

<script>
const SCRIPT_URL = "<?= scriptUrl ?>";
let state = {
  token: null,
  user: null,
  bed: null,
  taxonomy: null,
  suggestedGroup: null,
  plannedTask: null,
  activeSession: null,
  selectedActivity: null
};

function api(action, payload) {
  return fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // avoids CORS preflight on Apps Script web apps
    body: JSON.stringify({ action: action, token: state.token, payload: payload || {} })
  })
  .then(function (r) { return r.json(); })
  .then(function (res) {
    if (!res.ok) {
      const err = new Error(res.error.message);
      err.code = res.error.code;
      throw err;
    }
    return res.data;
  });
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}

function render(html) {
  document.getElementById('content').innerHTML = html;
}

function showError(msg) {
  return '<div class="error-box">' + msg + '</div>';
}

// ---------- Screen: Login ----------

function renderLogin(errorMsg) {
  document.getElementById('logoutBtn').classList.add('hidden');
  document.getElementById('topbarSub').textContent = 'Sign in';
  render(
    (errorMsg ? showError(errorMsg) : '') +
    '<div class="card">' +
      '<div class="field"><label>Worker ID</label><input id="userId" placeholder="USR-WORKER1" autocapitalize="characters"></div>' +
      '<div class="field"><label>PIN</label><input id="pin" type="password" inputmode="numeric" placeholder="\u2022\u2022\u2022\u2022"></div>' +
      '<button class="btn btn-primary" id="loginBtn">Log in</button>' +
    '</div>'
  );
  document.getElementById('loginBtn').onclick = doLogin;
}

function doLogin() {
  const userId = document.getElementById('userId').value.trim();
  const pin = document.getElementById('pin').value.trim();
  if (!userId || !pin) return renderLogin('Enter both a worker ID and PIN.');
  render('<div class="spinner">Signing in...</div>');
  api('login', { userId: userId, pin: pin })
    .then(function (data) {
      state.token = data.token;
      state.user = data.user;
      document.getElementById('logoutBtn').classList.remove('hidden');
      document.getElementById('topbarSub').textContent = data.user.Full_Name + ' \u00b7 ' + data.user.Role;
      checkForActiveSession();
    })
    .catch(function (err) { renderLogin(err.message); });
}

document.getElementById('logoutBtn').onclick = function () {
  api('logout', {}).finally(function () {
    state = { token: null, user: null, bed: null, taxonomy: null, suggestedGroup: null, plannedTask: null, activeSession: null, selectedActivity: null };
    renderLogin();
  });
};

function checkForActiveSession() {
  render('<div class="spinner">Checking for an open session...</div>');
  api('get-my-session', {})
    .then(function (session) {
      if (session) {
        state.activeSession = session;
        renderSession();
      } else {
        renderScan();
      }
    })
    .catch(function (err) { renderScan(); });
}

// ---------- Screen: Scan bed ----------

function renderScan(errorMsg) {
  render(
    (errorMsg ? showError(errorMsg) : '') +
    '<div class="card">' +
      '<div class="field"><label>Bed ID</label><input id="bedId" placeholder="e.g. B1-02" autocapitalize="characters"></div>' +
      '<div class="muted" style="margin-bottom:10px;">Scan the bed\'s QR code, or type the Bed ID printed on the stake.</div>' +
      '<button class="btn btn-primary" id="scanBtn">Scan / Confirm Bed</button>' +
    '</div>'
  );
  document.getElementById('scanBtn').onclick = doScan;
  document.getElementById('bedId').focus();
}

function doScan() {
  const bedId = document.getElementById('bedId').value.trim().toUpperCase();
  if (!bedId) return renderScan('Enter a bed ID.');
  render('<div class="spinner">Looking up bed...</div>');
  api('scan-bed', { bedId: bedId })
    .then(function (data) {
      state.bed = data.bed;
      state.taxonomy = data.taxonomy;
      state.suggestedGroup = data.suggestedGroup;
      state.plannedTask = data.plannedTask;
      if (data.activeSession) {
        state.activeSession = data.activeSession;
        renderSession();
      } else {
        renderTaskSelect();
      }
    })
    .catch(function (err) { renderScan(err.message); });
}

// ---------- Screen: Task select ----------

function renderTaskSelect() {
  const bed = state.bed;
  const groups = state.taxonomy.groups;
  const labels = state.taxonomy.labels;

  let plannedHtml = '';
  if (state.plannedTask) {
    plannedHtml = '<div class="success-box">Planned today: <b>' + labels[state.plannedTask.Activity_Type] + '</b>' +
      (state.plannedTask.Notes ? ' \u2014 ' + state.plannedTask.Notes : '') + '</div>';
  }

  let groupsHtml = '';
  const groupNames = Object.keys(groups);
  // suggested group first
  groupNames.sort(function (a, b) {
    if (a === state.suggestedGroup) return -1;
    if (b === state.suggestedGroup) return 1;
    return 0;
  });
  groupNames.forEach(function (g) {
    groupsHtml += '<div class="group-header">' + g + (g === state.suggestedGroup ? ' \u2713 suggested' : '') + '</div>';
    groupsHtml += '<div class="activity-grid">';
    groups[g].forEach(function (key) {
      const isPlanned = state.plannedTask && state.plannedTask.Activity_Type === key;
      groupsHtml += '<button class="activity-btn' + (isPlanned ? ' suggested' : '') + '" data-key="' + key + '">' + labels[key] + '</button>';
    });
    groupsHtml += '</div>';
  });

  render(
    '<div class="card">' +
      '<div class="row-between"><div><b>' + bed.Bed_ID + '</b><div class="muted">' + (bed.Current_Crop || 'unplanted') + ' \u00b7 ' + bed.Current_State + '</div></div>' +
      '<button class="btn btn-outline" id="rescanBtn" style="width:auto;margin:0;padding:8px 12px;font-size:12px;">Rescan</button></div>' +
    '</div>' +
    plannedHtml +
    '<div class="card">' + groupsHtml + '</div>'
  );

  document.getElementById('rescanBtn').onclick = function () { renderScan(); };
  document.querySelectorAll('.activity-btn').forEach(function (btn) {
    btn.onclick = function () { startSession(btn.getAttribute('data-key')); };
  });
}

function startSession(activityKey) {
  render('<div class="spinner">Starting session...</div>');
  api('start-session', { bedId: state.bed.Bed_ID, activityType: activityKey, plannedFlag: !!state.plannedTask })
    .then(function (session) {
      state.activeSession = session;
      renderSession();
    })
    .catch(function (err) { renderTaskSelect(); alert(err.message); });
}

// ---------- Screen: Active session ----------

function renderSession(errorMsg) {
  const s = state.activeSession;
  const label = (state.taxonomy && state.taxonomy.labels[s.Activity_Type]) || s.Activity_Type;
  const statusClass = 'badge-' + s.Session_Status.toLowerCase();
  const isPaused = s.Session_Status === 'PAUSED';

  render(
    (errorMsg ? showError(errorMsg) : '') +
    '<div class="card">' +
      '<div class="row-between"><span class="badge ' + statusClass + '">' + s.Session_Status + '</span>' +
      '<span class="muted">' + s.Bed_ID + '</span></div>' +
      '<div class="big-stat">' + label + '</div>' +
      '<div class="muted" style="text-align:center;">Cohort ' + (s.Cohort_ID || '\u2014') + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="btn-row">' +
        (isPaused
          ? '<button class="btn btn-primary" id="resumeBtn">Resume</button>'
          : '<button class="btn btn-amber" id="pauseBtn">Pause</button>') +
        '<button class="btn btn-primary" id="completeBtn">Complete</button>' +
      '</div>' +
      '<button class="btn btn-outline" id="exceptionBtn">\u26a0\ufe0f Report Exception</button>' +
    '</div>'
  );

  const pauseBtn = document.getElementById('pauseBtn');
  if (pauseBtn) pauseBtn.onclick = function () { transitionSession('pause-session'); };
  const resumeBtn = document.getElementById('resumeBtn');
  if (resumeBtn) resumeBtn.onclick = function () { transitionSession('resume-session'); };
  document.getElementById('completeBtn').onclick = renderCompleteForm;
  document.getElementById('exceptionBtn').onclick = renderExceptionForm;
}

function transitionSession(action) {
  render('<div class="spinner">Updating...</div>');
  api(action, { sessionId: state.activeSession.Session_ID })
    .then(function (session) { state.activeSession = session; renderSession(); })
    .catch(function (err) { renderSession(err.message); });
}

function renderCompleteForm() {
  const s = state.activeSession;
  const needsQty = s.Activity_Type === 'Harvest';
  render(
    '<div class="card">' +
      '<b>Complete session</b>' +
      '<div class="muted" style="margin-bottom:10px;">' + s.Bed_ID + ' \u00b7 ' + s.Activity_Type + '</div>' +
      (needsQty
        ? '<div class="field"><label>Quantity</label><input id="qty" type="number" inputmode="decimal" placeholder="e.g. 42"></div>' +
          '<div class="field"><label>Unit</label><select id="unit"><option value="lbs">lbs</option><option value="crates">crates</option></select></div>'
        : '') +
      '<button class="btn btn-primary" id="confirmCompleteBtn">Confirm Complete</button>' +
      '<button class="btn btn-outline" id="cancelCompleteBtn">Back</button>' +
    '</div>'
  );
  document.getElementById('cancelCompleteBtn').onclick = renderSession;
  document.getElementById('confirmCompleteBtn').onclick = function () {
    const payload = { sessionId: s.Session_ID };
    if (needsQty) {
      payload.loggedQuantity = document.getElementById('qty').value;
      payload.unit = document.getElementById('unit').value;
    }
    render('<div class="spinner">Completing...</div>');
    api('complete-session', payload)
      .then(function () {
        render('<div class="success-box">Session completed. A manager will verify it on the Live Board.</div>');
        setTimeout(function () { state.activeSession = null; renderScan(); }, 1600);
      })
      .catch(function (err) { renderCompleteForm(); alert(err.message); });
  };
}

const EXCEPTION_TYPES = [
  ['PestDiscovered', 'Pest Discovered'], ['DiseaseDiscovered', 'Disease Discovered'],
  ['IrrigationFailure', 'Irrigation Failure'], ['CropDamage', 'Crop Damage'],
  ['MissingMaterial', 'Missing Material'], ['EquipmentFailure', 'Equipment Failure'],
  ['SafetyIssue', 'Safety Issue'], ['Other', 'Other']
];

function renderExceptionForm() {
  const s = state.activeSession;
  let options = EXCEPTION_TYPES.map(function (t) { return '<option value="' + t[0] + '">' + t[1] + '</option>'; }).join('');
  render(
    '<div class="card">' +
      '<b>Report exception</b>' +
      '<div class="muted" style="margin-bottom:10px;">' + s.Bed_ID + ' \u00b7 ' + s.Activity_Type + '</div>' +
      '<div class="field"><label>Type</label><select id="excType">' + options + '</select></div>' +
      '<div class="field"><label>Severity</label><select id="excSeverity">' +
        '<option value="Low">Low</option><option value="Medium" selected>Medium</option>' +
        '<option value="High">High</option><option value="Critical">Critical</option>' +
      '</select></div>' +
      '<div class="field"><label>Notes</label><input id="excNotes" placeholder="What did you see?"></div>' +
      '<button class="btn btn-danger" id="submitExcBtn">Submit Exception</button>' +
      '<button class="btn btn-outline" id="cancelExcBtn">Back</button>' +
    '</div>'
  );
  document.getElementById('cancelExcBtn').onclick = renderSession;
  document.getElementById('submitExcBtn').onclick = function () {
    render('<div class="spinner">Reporting...</div>');
    api('report-exception', {
      sessionId: s.Session_ID,
      exceptionType: document.getElementById('excType').value,
      severity: document.getElementById('excSeverity').value,
      notes: document.getElementById('excNotes').value
    })
    .then(function (session) {
      state.activeSession = session;
      render('<div class="success-box">Exception logged. Manager alerted.</div>');
      setTimeout(renderSession, 1200);
    })
    .catch(function (err) { renderExceptionForm(); alert(err.message); });
  };
}

// ---------- Boot ----------
renderLogin();
</script>
</body>
</html>
